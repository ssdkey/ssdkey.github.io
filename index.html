<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iuuv - 但行好事 莫问前程</title>
    <meta name="keywords" content="iuuv, 个人主页, 博客, ssdkey">
    <meta name="description" content="iuuv 的个人主页 - 但行好事，莫问前程">
    <meta name="author" content="iuuv">
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 星空粒子画布 -->
    <canvas id="starfield"></canvas>

    <!-- 鼠标跟随光效 -->
    <div class="cursor-glow" id="cursorGlow"></div>

    <div class="container">
        <div class="content">
            <!-- 小熊猫头像 -->
            <div class="avatar-wrapper animate-in">
                <div class="avatar-ring">
                    <div class="avatar">
                        <img src="favicon.ico" alt="小熊猫" width="64" height="64">
                    </div>
                </div>
            </div>

            <!-- 标题 -->
            <h1 class="title animate-in delay-1">来到地球的</h1>

            <!-- 倒计时 -->
            <div class="countdown-wrapper animate-in delay-2">
                <div class="countdown-item">
                    <div class="countdown-card">
                        <span class="countdown-number" id="days">000</span>
                    </div>
                    <span class="countdown-label">DAYS</span>
                </div>
                <div class="countdown-separator">:</div>
                <div class="countdown-item">
                    <div class="countdown-card">
                        <span class="countdown-number" id="hours">00</span>
                    </div>
                    <span class="countdown-label">HOURS</span>
                </div>
                <div class="countdown-separator">:</div>
                <div class="countdown-item">
                    <div class="countdown-card">
                        <span class="countdown-number" id="minutes">00</span>
                    </div>
                    <span class="countdown-label">MINUTES</span>
                </div>
                <div class="countdown-separator">:</div>
                <div class="countdown-item">
                    <div class="countdown-card">
                        <span class="countdown-number seconds" id="seconds">00</span>
                    </div>
                    <span class="countdown-label">SECONDS</span>
                </div>
            </div>

            <!-- 座右铭 -->
            <p class="motto animate-in delay-3">"但行好事" "莫问前程"</p>

            <!-- 漩涡入口（点击进入导航页） -->
            <div class="vortex-wrap animate-in delay-3" id="vortexWrap">
                <canvas id="vortexCanvas" width="280" height="280"></canvas>
            </div>
        </div>

        <!-- 页脚 -->
        <footer class="footer animate-in delay-7">
            <a href="https://github.com/ssdkey" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                <svg height="20" viewBox="0 0 16 16" width="20" fill="currentColor">
                    <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                </svg>
            </a>
        </footer>
    </div>

    <!-- 全屏过渡层 -->
    <div class="page-transition" id="pageTransition"></div>

    <script src="js/starfield.js"></script>
    <script src="js/vortex.js"></script>
    <script>
    (function () {
        /* ===== 倒计时 ===== */
        const targetDate = new Date(Date.UTC(1994, 8, 25, 2, 0, 0) - 10 * 3600000);
        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');

        function updateCountdown() {
            const now = new Date();
            const diff = now - targetDate;
            if (diff < 0) return;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            animateNumber(daysEl, String(days).padStart(3, '0'));
            animateNumber(hoursEl, String(hours).padStart(2, '0'));
            animateNumber(minutesEl, String(minutes).padStart(2, '0'));
            animateNumber(secondsEl, String(seconds).padStart(2, '0'));
        }

        function animateNumber(el, newVal) {
            if (el.textContent !== newVal) {
                el.style.transform = 'translateY(-5px)';
                el.style.opacity = '0.5';
                setTimeout(() => {
                    el.textContent = newVal;
                    el.style.transform = 'translateY(0)';
                    el.style.opacity = '1';
                }, 150);
            }
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

    })();
    </script>
</body>
</html>
